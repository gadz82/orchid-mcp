name: orchid-mcp PR

on:
  pull_request:
    branches: [main]
    paths:
      - "orchid-mcp/**"
      - ".github/workflows/orchid-mcp-pr.yml"

jobs:
  pr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchid-mcp

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: orchid-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test Coverage
        run: npm run test:coverage
