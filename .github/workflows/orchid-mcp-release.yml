name: orchid-mcp Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    issues: write
    id-token: write
    packages: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Test Coverage
              run: npm run test:coverage

            - name: Obtain npm token via OIDC
              id: npm-oidc
              run: |
                ID_TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
                TOKEN=$(curl -sS -X POST \
                  -H "Authorization: Bearer $ID_TOKEN" \
                  "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@orchid-ai%2Forchid-mcp" | jq -r .token)
                echo "NPM_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
                echo "NODE_AUTH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

            - name: Semantic Release
              run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
